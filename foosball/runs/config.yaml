task_name: ${task.name}
experiment: ''
num_envs: 512
seed: 110
torch_deterministic: true
max_iterations: ''
physics_engine: physx
pipeline: gpu
sim_device: gpu
device_id: 0
rl_device: cuda:0
multi_gpu: false
num_threads: 16
solver_type: 1
test: true
checkpoint: C:\Users\cedri\OneDrive\Desktop\Foosball\models\ppo_1.pth
evaluation: false
headless: true
capture: false
enable_livestream: false
mt_timeout: 30
enable_recording: false
recording_interval: 2000
recording_length: 100
recording_fps: 30
recording_dir: ''
wandb_activate: false
wandb_group: ''
wandb_name: ${train.params.config.name}
wandb_entity: ''
wandb_project: Foosball
log_dir: runs
kit_app: ''
extras: []
warp: false
task:
  name: FoosballSelfPlay
  physics_engine: ${..physics_engine}
  env:
    numEnvs: ${resolve_default:256,${...num_envs}}
    envSpacing: 3
    episodeLength: 900
    clipActions: 1.0
    controlFrequencyInv: 6
    resetJointNoise: 0.0
    resetPositionNoise: 0.25
    resetVelocityNoise: 5
    distToBallReward: false
    terminationHeight: 0.1
    terminationPenalty: 0
    stagnationPenalty: 0
    timeoutPenalty: 0
    winReward: 1
    lossPenalty: 1
    num_opponents: 1
    object_centric_obs: false
    flatten_obs: false
    ball_relative_obs: true
    applyKalmanFiltering: false
    applyKinematicConstraints: false
    goal_factor: 2503
  sim:
    dt: 0.00277778
    use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
    gravity:
    - 0.0
    - 0.0
    - -9.81
    add_ground_plane: true
    add_distant_light: true
    use_flatcache: true
    enable_scene_query_support: false
    disable_contact_processing: false
    enable_cameras: false
    default_physics_material:
      static_friction: 1.0
      dynamic_friction: 1.0
      restitution: 0.0
    physx:
      worker_thread_count: ${....num_threads}
      solver_type: ${....solver_type}
      use_gpu: ${eq:${....sim_device},"gpu"}
      solver_position_iteration_count: 12
      solver_velocity_iteration_count: 1
      contact_offset: 0.0002
      rest_offset: 0.0
      bounce_threshold_velocity: 0.02
      friction_offset_threshold: 0.04
      friction_correlation_distance: 0.025
      enable_sleeping: true
      enable_stabilization: true
      max_depenetration_velocity: 1000.0
      gpu_max_rigid_contact_count: 524288
      gpu_max_rigid_patch_count: 163840
      gpu_found_lost_pairs_capacity: 65536
      gpu_found_lost_aggregate_pairs_capacity: 262144
      gpu_total_aggregate_pairs_capacity: 65536
      gpu_max_soft_body_contacts: 1048576
      gpu_max_particle_contacts: 1048576
      gpu_heap_capacity: 67108864
      gpu_temp_buffer_capacity: 16777216
      gpu_max_num_partitions: 8
    Foosball:
      override_usd_defaults: false
      enable_self_collisions: false
      enable_gyroscopic_forces: true
      solver_position_iteration_count: 12
      solver_velocity_iteration_count: 1
      sleep_threshold: 0.005
      stabilization_threshold: 0.01
      density: -1
      max_depenetration_velocity: 1000.0
      contact_offset: 0.0002
      rest_offset: 0.0
    Ball:
      override_usd_defaults: false
      make_kinematic: false
      enable_self_collisions: false
      enable_gyroscopic_forces: true
      solver_position_iteration_count: 12
      solver_velocity_iteration_count: 1
      sleep_threshold: 0.005
      stabilization_threshold: 0.01
      max_depenetration_velocity: 1000.0
      contact_offset: 0.0002
      rest_offset: 0.0
train:
  params:
    network:
      name: actor_critic
      separate: false
      space:
        continuous:
          mu_activation: None
          sigma_activation: None
          mu_init:
            name: default
          value_init:
            name: default
          sigma_init:
            name: const_initializer
            val: 0
          fixed_sigma: true
      mlp:
        units:
        - 256
        - 256
        - 128
        activation: tanh
        d2rl: false
        initializer:
          name: default
        regularizer:
          name: None
      transformer:
        emb_dim: 128
        num_heads: 8
        num_blocks: 3
        activation: relu
        dropout_prob: 0.0
        pooling_type: avg
    config:
      self_play_config:
        opponent:
          network:
            name: oc_transformer
            separate: false
            space:
              continuous:
                mu_activation: None
                sigma_activation: None
                mu_init:
                  name: default
                value_init:
                  name: default
                sigma_init:
                  name: const_initializer
                  val: 0
                fixed_sigma: true
            mlp:
              units: []
              activation: tanh
              d2rl: false
              initializer:
                name: default
              regularizer:
                name: None
            transformer:
              emb_dim: 128
              num_heads: 8
              num_blocks: 3
              activation: relu
              dropout_prob: 0.0
              pooling_type: avg
          checkpoint: ./models/orbit_3.pth
          object_centric_obs: true
          ball_relative_obs: true
          flatten_obs: ${......task.env.flatten_obs}
        update_score: 0.2
        games_to_check: 100
        env_update_num: 1
        check_scores: true
        test: ${.....test}
      name: ${resolve_default:FoosballSelfPlay,${....experiment}}
      full_experiment_name: ${.name}
      env_name: rlgpu
      device: ${....rl_device}
      device_name: ${....rl_device}
      multi_gpu: false
      ppo: true
      mixed_precision: false
      normalize_input: false
      normalize_value: true
      clip_actions: true
      num_actors: ${....task.env.numEnvs}
      reward_shaper:
        scale_value: 0.01
      normalize_advantage: true
      gamma: 0.99
      tau: 0.95
      learning_rate: 0.0003
      lr_schedule: adaptive
      schedule_type: legacy
      kl_threshold: 0.008
      score_to_win: 10000000
      max_epochs: ${resolve_default:10000,${....max_iterations}}
      save_best_after: 100
      save_frequency: 250
      grad_norm: 1.0
      entropy_coef: 0.0001
      truncate_grads: true
      e_clip: 0.2
      horizon_length: 16
      minibatch_size: 4096
      mini_epochs: 1
      critic_coef: 4
      clip_value: true
      seq_len: 4
      bounds_loss_coef: 0.0001
      train_dir: ${....log_dir}
      env_config:
        name: foosball_self_play_v0
        self_play: true
        agents: 2
        config_path: cfg/train/FoosballSelfPlayPPO.yaml
      player:
        games_num: 5000
        max_goals: 1000
    seed: ${...seed}
    framework: PPO
    algo:
      name: a2c_continuous
    model:
      name: continuous_a2c_logstd
    dmp:
      active: false
      type: discrete
      rbfs:
        numRBFs: 20
        kernel: gaussian
      gains:
        fixed: true
        scale: 1
      tau:
        fixed: true
        scale: 1
      weight_scale: 1
      dt: ${....task.sim.dt}
      controlFrequencyInv: ${....task.env.controlFrequencyInv}
    load_checkpoint: ${if:${...checkpoint},True,False}
    load_path: ${...checkpoint}
